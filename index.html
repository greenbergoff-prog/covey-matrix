<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Матрица Кови — 4 квадрата</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#f9f8f6;
    color:#1a1a1a;
    padding:24px;
    min-height:100vh;
  }
  .header{margin-bottom:20px;}
  .header h1{font-size:20px;font-weight:600;color:#1a1a1a;margin-bottom:4px;}
  .header p{font-size:13px;color:#888;margin-bottom:0;}
  .badge-focus{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:20px;background:#E1F5EE;color:#0F6E56;font-weight:600;margin-left:6px;vertical-align:middle;}
  .axis-wrap{display:grid;grid-template-columns:22px 1fr;gap:0;align-items:center;}
  .axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;color:#aaa;text-align:center;letter-spacing:0.1em;text-transform:uppercase;user-select:none;}
  .right-col{display:flex;flex-direction:column;gap:0;}
  .axis-x{display:flex;justify-content:space-between;padding:0 4px;margin-bottom:6px;}
  .axis-x span{font-size:10px;color:#aaa;letter-spacing:0.08em;text-transform:uppercase;user-select:none;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .quadrant{
    background:#fff;
    border-radius:12px;
    border:1px solid #ebebeb;
    padding:14px;
    min-height:200px;
    position:relative;
  }
  .quadrant.q1{border-top:3px solid #E24B4A;}
  .quadrant.q2{border-top:3px solid #1D9E75;}
  .quadrant.q3{border-top:3px solid #BA7517;}
  .quadrant.q4{border-top:3px solid #888;}

  .q-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
  .q-label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;}
  .q1 .q-label{color:#A32D2D;}
  .q2 .q-label{color:#0F6E56;}
  .q3 .q-label{color:#854F0B;}
  .q4 .q-label{color:#5F5E5A;}
  .q-name{font-size:11px;color:#aaa;margin-top:2px;}

  .add-btn{
    background:none;border:1px solid #e0e0e0;border-radius:8px;
    width:26px;height:26px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;color:#999;flex-shrink:0;transition:background 0.15s;
  }
  .add-btn:hover{background:#f5f5f5;}

  .tasks{display:flex;flex-direction:column;gap:6px;}
  .task-card{
    background:#f7f7f5;border-radius:8px;padding:9px 11px;
    cursor:pointer;border:1px solid #ebebeb;transition:border-color 0.15s;
  }
  .task-card:hover{border-color:#ccc;background:#f0f0ee;}
  .task-title{font-size:13px;font-weight:500;color:#1a1a1a;margin-bottom:2px;}
  .task-date{font-size:11px;color:#aaa;display:flex;align-items:center;gap:3px;margin-top:3px;}

  .empty-hint{font-size:12px;color:#ccc;text-align:center;padding:20px 0;font-style:italic;}

  /* Inline form */
  .form-overlay{display:none;margin-top:10px;}
  .form-overlay.active{display:block;}
  .form-panel{background:#fafafa;border:1px solid #e0e0e0;border-radius:10px;padding:12px;}
  .form-label{font-size:10px;color:#999;margin-bottom:3px;display:block;text-transform:uppercase;letter-spacing:0.05em;}
  .form-panel input,.form-panel textarea{
    width:100%;margin-bottom:8px;font-size:13px;padding:7px 10px;
    border:1px solid #e0e0e0;border-radius:7px;background:#fff;color:#1a1a1a;
    outline:none;font-family:inherit;
  }
  .form-panel textarea{resize:vertical;min-height:56px;}
  .form-panel input:focus,.form-panel textarea:focus{border-color:#aaa;}
  .form-actions{display:flex;gap:6px;justify-content:flex-end;}
  .btn-cancel{background:none;border:1px solid #e0e0e0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;color:#888;}
  .btn-save{background:#1a1a1a;border:none;border-radius:7px;padding:6px 14px;font-size:12px;cursor:pointer;color:#fff;font-family:inherit;}
  .btn-cancel:hover{background:#f0f0f0;}
  .btn-save:hover{background:#333;}

  /* Modal */
  .modal-backdrop{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,0.35);z-index:200;
    align-items:center;justify-content:center;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:#fff;border-radius:14px;border:1px solid #e8e8e8;
    padding:22px;width:360px;max-width:92vw;
  }
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .modal-header h3{font-size:15px;font-weight:600;color:#1a1a1a;}
  .modal-close{background:none;border:none;cursor:pointer;color:#aaa;font-size:18px;padding:2px;line-height:1;}
  .modal-q-badge{display:inline-flex;align-items:center;font-size:11px;padding:3px 10px;border-radius:20px;background:#f5f5f5;font-weight:600;margin-bottom:12px;}
  .modal-desc{font-size:13px;color:#555;margin-bottom:10px;line-height:1.6;white-space:pre-wrap;}
  .modal-date{font-size:12px;color:#aaa;display:flex;align-items:center;gap:5px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  .btn-danger{background:#E24B4A;border:none;border-radius:7px;padding:7px 14px;font-size:12px;cursor:pointer;color:#fff;font-family:inherit;}
  .btn-danger:hover{background:#c43b3a;}

  @media(max-width:600px){
    body{padding:14px;}
    .grid{grid-template-columns:1fr;}
    .modal{width:95vw;}
  }
</style>
</head>
<body>

<div class="header">
  <h1>Матрица приоритетов <span style="font-size:13px;font-weight:400;color:#aaa;">— Навык 3, Кови</span></h1>
  <p>Распределяй задачи по важности и срочности. Главный фокус — Квадрат 2.</p>
</div>

<div class="axis-wrap">
  <div class="axis-y">Важность</div>
  <div class="right-col">
    <div class="axis-x">
      <span>← не срочно</span>
      <span>срочно →</span>
    </div>
    <div class="grid">

      <!-- Q1 -->
      <div class="quadrant q1">
        <div class="q-header">
          <div>
            <div class="q-label">Q1 · Сделать</div>
            <div class="q-name">Важно и срочно</div>
          </div>
          <button class="add-btn" onclick="openForm('q1')" title="Добавить задачу">
            <i class="ti ti-plus"></i>
          </button>
        </div>
        <div class="tasks" id="tasks-q1"></div>
        <div class="form-overlay" id="form-q1">
          <div class="form-panel">
            <label class="form-label">Задача</label>
            <input type="text" id="title-q1" placeholder="Название задачи..." maxlength="80"/>
            <label class="form-label">Описание</label>
            <textarea id="desc-q1" placeholder="Детали, контекст..."></textarea>
            <label class="form-label">Дедлайн</label>
            <input type="date" id="date-q1"/>
            <div class="form-actions">
              <button class="btn-cancel" onclick="closeForm('q1')">Отмена</button>
              <button class="btn-save" onclick="saveTask('q1')">Сохранить</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Q2 -->
      <div class="quadrant q2">
        <div class="q-header">
          <div>
            <div class="q-label">Q2 · Планировать <span class="badge-focus">⭐ Фокус</span></div>
            <div class="q-name">Важно, не срочно</div>
          </div>
          <button class="add-btn" onclick="openForm('q2')" title="Добавить задачу">
            <i class="ti ti-plus"></i>
          </button>
        </div>
        <div class="tasks" id="tasks-q2"></div>
        <div class="form-overlay" id="form-q2">
          <div class="form-panel">
            <label class="form-label">Задача</label>
            <input type="text" id="title-q2" placeholder="Название задачи..." maxlength="80"/>
            <label class="form-label">Описание</label>
            <textarea id="desc-q2" placeholder="Детали, контекст..."></textarea>
            <label class="form-label">Дедлайн</label>
            <input type="date" id="date-q2"/>
            <div class="form-actions">
              <button class="btn-cancel" onclick="closeForm('q2')">Отмена</button>
              <button class="btn-save" onclick="saveTask('q2')">Сохранить</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Q3 -->
      <div class="quadrant q3">
        <div class="q-header">
          <div>
            <div class="q-label">Q3 · Делегировать</div>
            <div class="q-name">Срочно, не важно</div>
          </div>
          <button class="add-btn" onclick="openForm('q3')" title="Добавить задачу">
            <i class="ti ti-plus"></i>
          </button>
        </div>
        <div class="tasks" id="tasks-q3"></div>
        <div class="form-overlay" id="form-q3">
          <div class="form-panel">
            <label class="form-label">Задача</label>
            <input type="text" id="title-q3" placeholder="Название задачи..." maxlength="80"/>
            <label class="form-label">Описание</label>
            <textarea id="desc-q3" placeholder="Детали, контекст..."></textarea>
            <label class="form-label">Дедлайн</label>
            <input type="date" id="date-q3"/>
            <div class="form-actions">
              <button class="btn-cancel" onclick="closeForm('q3')">Отмена</button>
              <button class="btn-save" onclick="saveTask('q3')">Сохранить</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Q4 -->
      <div class="quadrant q4">
        <div class="q-header">
          <div>
            <div class="q-label">Q4 · Исключить</div>
            <div class="q-name">Не важно, не срочно</div>
          </div>
          <button class="add-btn" onclick="openForm('q4')" title="Добавить задачу">
            <i class="ti ti-plus"></i>
          </button>
        </div>
        <div class="tasks" id="tasks-q4"></div>
        <div class="form-overlay" id="form-q4">
          <div class="form-panel">
            <label class="form-label">Задача</label>
            <input type="text" id="title-q4" placeholder="Название задачи..." maxlength="80"/>
            <label class="form-label">Описание</label>
            <textarea id="desc-q4" placeholder="Детали, контекст..."></textarea>
            <label class="form-label">Дедлайн</label>
            <input type="date" id="date-q4"/>
            <div class="form-actions">
              <button class="btn-cancel" onclick="closeForm('q4')">Отмена</button>
              <button class="btn-save" onclick="saveTask('q4')">Сохранить</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-backdrop" id="modal" onclick="handleBackdrop(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-badge" class="modal-q-badge"></div>
    <div class="modal-desc" id="modal-desc"></div>
    <div class="modal-date" id="modal-date"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Закрыть</button>
      <button class="btn-danger" onclick="deleteCurrentTask()">🗑 Удалить</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'covey-matrix-v1';
let tasks = {q1:[],q2:[],q3:[],q4:[]};
let current = null;

const qMeta = {
  q1:{name:'Q1 · Сделать', color:'#A32D2D'},
  q2:{name:'Q2 · Планировать', color:'#0F6E56'},
  q3:{name:'Q3 · Делегировать', color:'#854F0B'},
  q4:{name:'Q4 · Исключить', color:'#5F5E5A'},
};

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) tasks = JSON.parse(raw);
  }catch(e){}
  renderAll();
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }catch(e){}
}

function renderAll(){
  ['q1','q2','q3','q4'].forEach(q => render(q));
}

function fmtDate(d){
  if(!d) return '';
  const [y,m,dd] = d.split('-');
  return `${dd}.${m}.${y}`;
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(q){
  const el = document.getElementById('tasks-'+q);
  const list = tasks[q]||[];
  if(!list.length){
    el.innerHTML='<div class="empty-hint">Нажми + чтобы добавить задачу</div>';
    return;
  }
  el.innerHTML = list.map((t,i)=>`
    <div class="task-card" onclick="openModal('${q}',${i})">
      <div class="task-title">${esc(t.title)}</div>
      ${t.date?`<div class="task-date">📅 ${fmtDate(t.date)}</div>`:''}
    </div>
  `).join('');
}

function openForm(q){
  closeAllForms();
  document.getElementById('form-'+q).classList.add('active');
  document.getElementById('title-'+q).focus();
}

function closeForm(q){
  document.getElementById('form-'+q).classList.remove('active');
  ['title','desc','date'].forEach(f => document.getElementById(f+'-'+q).value='');
}

function closeAllForms(){
  ['q1','q2','q3','q4'].forEach(q => closeForm(q));
}

function saveTask(q){
  const title = document.getElementById('title-'+q).value.trim();
  if(!title) return;
  const desc = document.getElementById('desc-'+q).value.trim();
  const date = document.getElementById('date-'+q).value;
  tasks[q].push({id: Date.now()+'', title, desc, date});
  closeForm(q);
  render(q);
  save();
}

function openModal(q,i){
  const t = tasks[q][i];
  current = {q,i};
  document.getElementById('modal-title').textContent = t.title;
  const m = qMeta[q];
  document.getElementById('modal-badge').innerHTML =
    `<span style="color:${m.color}">${m.name}</span>`;
  document.getElementById('modal-desc').textContent = t.desc || 'Описание не указано.';
  document.getElementById('modal-date').innerHTML = t.date
    ? `📅 Дедлайн: ${fmtDate(t.date)}` : '';
  document.getElementById('modal').classList.add('open');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  current = null;
}

function handleBackdrop(e){
  if(e.target===document.getElementById('modal')) closeModal();
}

function deleteCurrentTask(){
  if(!current) return;
  tasks[current.q].splice(current.i, 1);
  render(current.q);
  save();
  closeModal();
}

document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ closeModal(); closeAllForms(); }
});

load();
</script>
</body>
</html>
